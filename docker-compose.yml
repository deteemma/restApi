services:
  mongo:
    image: mongo:8
    container_name: restapi-mongo
    restart: unless-stopped
    ports:
      # Exposé uniquement en local (voir ADR 0001 / Q44).
      # 27018 côté hôte : 27017 est souvent occupé par un MongoDB installé localement.
      - '127.0.0.1:27018:27017'
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
